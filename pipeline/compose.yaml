# Local runner. `worker` ingests one file: docker compose -f pipeline/compose.yaml run --rm worker /in/bbb.mp4
# MinIO is the stand-in for GCS/S3 once milestone 2 publishes outputs; start it with --profile publish.
services:
  worker:
    build: .
    volumes:
      - ./work:/app/work
      - ../media/src:/in:ro

  # Postgres for auth, upload history and benchmark runs: docker compose -f pipeline/compose.yaml up -d db
  # Published on loopback only. The credentials are a local default, not for anything shared.
  db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: mediacdn
      POSTGRES_PASSWORD: mediacdn
      POSTGRES_DB: mediacdn
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediacdn"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    profiles: [publish]
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  pg-data:
  minio-data:
